<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASM Pong Web</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell" aria-label="ASM Pong Web game">
    <header class="scoreboard" aria-live="polite">
      <div>
        <span class="label">PLAYER</span>
        <strong id="playerScore">0</strong>
      </div>
      <h1>ASM PONG</h1>
      <div>
        <span class="label">CPU</span>
        <strong id="cpuScore">0</strong>
      </div>
    </header>

    <section class="arena-wrap">
      <canvas id="gameCanvas" width="960" height="540" aria-label="Pong playfield"></canvas>
      <div class="overlay" id="overlay">
        <p id="overlayTitle">READY</p>
        <button id="startButton" type="button">Start</button>
      </div>
    </section>

    <footer class="controls">
      <button id="upButton" type="button" aria-label="Move up">W</button>
      <button id="restartButton" type="button">Restart</button>
      <button id="downButton" type="button" aria-label="Move down">S</button>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
