<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ASM Pong">
  <meta name="description" content="A browser-playable Pong game with ARM64 assembly roots.">
  <title>ASM Pong Web</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/asm-pong-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/asm-pong-icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell" aria-label="ASM Pong Web game">
    <header class="scoreboard" aria-live="polite">
      <div>
        <span class="label">PLAYER</span>
        <strong id="playerScore">0</strong>
        <small id="playerStats">hits 0</small>
      </div>
      <h1>ASM PONG</h1>
      <div>
        <span class="label">CPU</span>
        <strong id="cpuScore">0</strong>
        <small id="cpuStats">rally 0</small>
      </div>
    </header>

    <div class="statusbar" aria-live="polite">
      <span id="powerStatus">POWER: WAITING</span>
      <span id="rallyStatus">RALLY: 0</span>
    </div>

    <section class="arena-wrap">
      <canvas id="gameCanvas" width="960" height="540" aria-label="Pong playfield"></canvas>
      <div class="overlay" id="overlay">
        <p id="overlayTitle">READY</p>
        <button id="startButton" type="button">Start</button>
      </div>
    </section>

    <footer class="controls">
      <button id="upButton" type="button" aria-label="Move up">W</button>
      <button id="restartButton" type="button">Restart</button>
      <button id="pauseButton" type="button">Pause</button>
      <button id="downButton" type="button" aria-label="Move down">S</button>
    </footer>
  </main>

  <script src="game.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js");
      });
    }
  </script>
</body>
</html>
